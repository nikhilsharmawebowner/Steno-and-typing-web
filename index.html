<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steno Typing App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: white;
      width: 100%;
      max-width: 900px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }
    /* Scrollable Paragraph Container Fix */
    .paragraph-box {
      height: 200px;
      overflow-y: auto;
      border: 2px solid #e0e0e0;
      padding: 15px;
      border-radius: 8px;
      font-size: 20px;
      line-height: 1.8;
      background: #fafafa;
      margin-bottom: 20px;
      scroll-behavior: smooth;
    }
    .word {
      display: inline-block;
      margin-right: 8px;
      padding: 2px 4px;
      border-radius: 4px;
    }
    .word.active {
      background-color: #ffe082;
      font-weight: bold;
    }
    .word.correct {
      color: #2e7d32;
    }
    .word.incorrect {
      color: #c62828;
      text-decoration: line-through;
    }
    textarea {
      width: 100%;
      height: 120px;
      font-size: 18px;
      padding: 15px;
      border: 2px solid #ccc;
      border-radius: 8px;
      outline: none;
      resize: none;
    }
    textarea:focus {
      border-color: #1976d2;
    }
  </style>

  <!-- Firebase Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB1vFIVBkJSZfTeYGczoIoW54HlXWSZHnc",
      authDomain: "stenotypingweb.firebaseapp.com",
      projectId: "stenotypingweb",
      storageBucket: "stenotypingweb.firebasestorage.app",
      messagingSenderId: "306419683032",
      appId: "1:306419683032:web:53f0a6b404375019ad91ad",
      measurementId: "G-HWFMTYXVMW"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Default Sample Paragraph
    const sampleText = "Stenography is a valuable skill that requires regular practice and extreme accuracy. As you type through this paragraph, notice how the text smoothly scrolls line by line without stopping or hiding the remaining words. No matter how long your test paragraph is—whether it contains fifty words or five hundred words—the system handles scrolling automatically and plays keypress sounds reliably.";

    let wordsArray = sampleText.split(" ");
    const paragraphBox = document.getElementById("paragraphBox");
    const typingInput = document.getElementById("typingInput");

    // Render Words
    function renderParagraph() {
      paragraphBox.innerHTML = "";
      wordsArray.forEach((word, index) => {
        const span = document.createElement("span");
        span.className = "word";
        if (index === 0) span.classList.add("active");
        span.innerText = word;
        paragraphBox.appendChild(span);
      });
    }

    renderParagraph();

    // Keypress Audio Setup
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep() {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    }

    // Typing Event & Auto-Scroll
    typingInput.addEventListener("input", (e) => {
      playBeep();

      const typedText = typingInput.value.trim().split(/\s+/);
      const wordElements = paragraphBox.getElementsByClassName("word");

      for (let i = 0; i < wordElements.length; i++) {
        wordElements[i].classList.remove("active");
        if (typedText[i] !== undefined) {
          if (typedText[i] === wordsArray[i]) {
            wordElements[i].className = "word correct";
          } else {
            wordElements[i].className = "word incorrect";
          }
        }
      }

      const currentIndex = typedText.length - 1;
      if (wordElements[currentIndex]) {
        wordElements[currentIndex].classList.add("active");
        // Smooth Auto-Scroll Logic Fix
        wordElements[currentIndex].scrollIntoView({
          behavior: 'smooth',
          block: 'center'
        });
      }
    });
  </script>
</head>
<body>

  <div class="container">
    <h1>Steno Typing Practice</h1>
    <div class="paragraph-box" id="paragraphBox"></div>
    <textarea id="typingInput" placeholder="Start typing here..."></textarea>
  </div>

</body>
</html>
